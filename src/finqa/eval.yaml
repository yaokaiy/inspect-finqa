    source: "https://raw.githubusercontent.com/czyssrs/FinQA/0f16e2867befa6840783e58be38c9efb9229d742/dataset/test.json"
    fetch_method: other
    state: pinned
    comment: Read at runtime by json_dataset from a commit-pinned URL

metadata:
  requires:
    internet: true
